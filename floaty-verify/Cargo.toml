[package]
name = "floaty-verify"
description = "Verification harness that compares floaty against reference implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
build = "build/main.rs"

[dependencies]
# The host-path tests run the slice paths in each instruction set of the
# processor, which `FLOATY_HOST_LEVEL` selects. The margin tests read the
# margins of the balls of the elementary functions.
floaty = { workspace = true, features = ["override-host-level", "record-margins"] }
rustc_apfloat.workspace = true

# MPFR builds only for x86-64, with the other references. The tests of
# unmasked SSE exceptions catch SIGFPE with libc.
[target.'cfg(target_arch = "x86_64")'.dependencies]
rug.workspace = true
libc.workspace = true

[lints]
workspace = true

[[bench]]
name = "operations"
harness = false
