[package]
name = "floaty-verify"
description = "Verification harness that compares floaty against reference implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
build = "build/main.rs"

[features]
alloc = ["floaty/alloc"]

[dependencies]
# The host-path tests run the slice paths in each instruction set of the
# processor, which `FLOATY_HOST_LEVEL` selects.
floaty = { workspace = true, features = ["override-host-level"] }
rustc_apfloat.workspace = true

# MPFR builds only for x86-64, with the other references.
[target.'cfg(target_arch = "x86_64")'.dependencies]
rug.workspace = true

[lints]
workspace = true

[[bench]]
name = "operations"
harness = false
